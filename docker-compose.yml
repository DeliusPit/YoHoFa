## Legacy helper: PostgreSQL only.
## Use `compose.yml` for the current full Geldzaken stack.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geldzaken
      POSTGRES_USER: geldzaken
      POSTGRES_PASSWORD: geldzaken
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geldzaken -d geldzaken"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
