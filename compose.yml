services:
  postgres:
    image: postgres:18
    container_name: hohoho-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    networks:
      - hohoho-backend

  mysql:
    image: mysql:8.4
    container_name: hohoho-mysql
    restart: unless-stopped
    profiles: ["mysql"]

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hohoho}
      MYSQL_USER: ${MYSQL_USER:-hohoho}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}

    volumes:
      - ./data/mysql:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    ports:
      - "127.0.0.1:3306:3306"

    networks:
      - hohoho-backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hohoho-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - path: ./config/.env
        required: false

    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      WEB_DIR: /app/web/dist
      CONFIG_PATH: /app/config/storage.json
      CONFIG_EDITABLE: ${CONFIG_EDITABLE:-true}
      CONFIG_BOOTSTRAP_FROM_ENV: ${CONFIG_BOOTSTRAP_FROM_ENV:-false}
      STORAGE_PROFILE: ${STORAGE_PROFILE:-server}
      STORE_BACKEND: ${STORE_BACKEND:-postgres}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/sqlite/hohoho.db}
      DATABASE_DATA_ROOT: /app/data/sqlite
      BACKUP_WORK_ROOT: /app/data/backup-work
      OBJECT_BACKEND: ${OBJECT_BACKEND:-s3}
      OBJECT_FILESYSTEM_ROOT: ${OBJECT_FILESYSTEM_ROOT:-/app/data/objects}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-hohoho-documents}
      S3_USE_TLS: ${S3_USE_TLS:-true}
      S3_REGION: ${S3_REGION:-garage}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}

    volumes:
      - ./config:/app/config
      - ./data/objects:/app/data/objects
      - ./data/sqlite:/app/data/sqlite
      - ./data/backup-work:/app/data/backup-work

    networks:
      - hohoho-backend

networks:
  hohoho-backend:
    name: hohoho-backend
