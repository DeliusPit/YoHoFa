# V3 foundation: SQLite is embedded in the application.
# Connect S3_* to an existing Garage installation; managed Garage comes later.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hohoho-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ./.env
        required: false
      # Transitional input for existing installations; storage.json is ignored.
      - path: ./config/.env
        required: false
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      WEB_DIR: /app/web/dist
      DATABASE_PATH: /app/data/hohoho.db
      BANK_CONFIG_DIR: /app/config/banks
    volumes:
      - ./data/v3:/app/data
      - ./config/banks:/app/config/banks
    networks:
      - hohoho-backend

networks:
  hohoho-backend:
    name: hohoho-backend
